[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers --tb=short
markers =
    unit: one function in isolation -- no HTTP, no browser
    integration: app, database and routing via Flask's test client -- no browser
    e2e: a real headless browser against a real HTTP server
    auth: login, logout, and protected-route behaviour
    dashboard: async load and explicit-wait behaviour
    roster: roster table, add/remove, and boundary rules
    waiver: sorting and filtering
    search: search results and empty states
